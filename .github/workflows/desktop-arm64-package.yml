name: Fork Desktop ARM64 installers

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version: auto adds the UTC date, run number and attempt'
        type: string
        default: auto
        required: true

permissions:
  contents: read

concurrency:
  group: fork-desktop-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'huohua-dev/deepseek-harness'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-arm64
            runner: windows-11-arm
            shell: pwsh
            command: package:desktop:win:arm64:unsigned
            extension: exe
          - target: mac-arm64
            runner: macos-15
            shell: bash
            command: package:desktop:mac:arm64:unsigned
            extension: dmg
    name: Package ${{ matrix.target }} (unsigned)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          architecture: arm64
      - name: Report host
        run: node -p "process.platform + '-' + process.arch + ' ' + process.version"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare unsigned fork settings
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version || 'auto' }}
        run: node apps/desktop/scripts/prepare-fork-ci.mjs
      - name: Check packaging configuration and toolchain
        run: pnpm run ${{ matrix.command }} --check --build-version "${{ steps.settings.outputs.version }}"
      - name: Build installer and verify packaged runtime
        run: pnpm run ${{ matrix.command }} --build-version "${{ steps.settings.outputs.version }}"
      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.target }}-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.target }}-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
