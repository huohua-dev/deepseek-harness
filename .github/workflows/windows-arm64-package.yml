name: Windows ARM64 installer (unsigned)

on:
  # A fork cannot dispatch a workflow absent from its default branch, so pushes to this branch also build.
  push:
    branches: [feat/desktop-win-arm64]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version: auto generates a version; otherwise enter a full version'
        type: string
        default: auto
        required: true
      policy_origin:
        description: 'Mandatory-update policy HTTPS origin (no path); the default never answers, so no update is ever forced'
        type: string
        default: https://mandatory-update.invalid
        required: true

permissions:
  contents: read

concurrency:
  group: windows-arm64-desktop-package
  cancel-in-progress: false

jobs:
  package:
    # GitHub-hosted Windows 11 ARM64 runner: packaging executes the arm64 Electron, Python and Node runtimes.
    runs-on: windows-11-arm
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          architecture: arm64
      - name: Report host
        run: |
          node -p "process.platform + '-' + process.arch + ' ' + process.version"
          pnpm --version
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Validate inputs and prepare public package settings
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version || 'auto' }}
          PACKAGE_DEPLOYMENT: production
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin || 'https://mandatory-update.invalid' }}
          PACKAGE_LOGIN_ORIGINS: ''
        run: node apps/desktop/scripts/prepare-windows-ci.mjs
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:arm64:unsigned --check --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:arm64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-arm64-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-arm64-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/targets/win-arm64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove generated package settings
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if (Test-Path -LiteralPath apps/desktop/.env.windows) {
            Remove-Item -LiteralPath apps/desktop/.env.windows
          }
